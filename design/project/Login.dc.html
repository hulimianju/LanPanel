<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif;background:#0A0B0E;color:#EDEDEF}
a{color:#A5A0FF;text-decoration:none}a:hover{color:#C7C4FF}
.lp-dots{background-color:#0A0B0E;background-image:radial-gradient(rgba(255,255,255,0.07) 1px,transparent 1px);background-size:24px 24px}
</style>
</helmet>
<div class="lp-dots" style="width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center; font-family: 'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif; color: #EDEDEF;">
<form style="width: 380px; box-sizing: border-box; padding: 32px; border-radius: 16px; background: rgba(22,23,28,0.92); border: 1px solid rgba(255,255,255,0.09); display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 6px;">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #4F46E5; display: flex; align-items: center; justify-content: center;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12l6-6M19 12a7 7 0 1 1-7-7M15 12a3 3 0 1 1-3-3"></path></svg>
</div>
<h1 style="margin: 0; font-size: 20px; font-weight: 600;">登录 LanPanel</h1>
<p style="margin: 0; font-size: 13px; color: #A1A1AA;">管理面板、设备与扫描规则</p>
</div>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 500; color: #D4D4D8;">用户名</span>
<input value="admin" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #EDEDEF; font: inherit; font-size: 14px;"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 500; color: #D4D4D8;">密码</span>
<input type="password" value="password" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #EDEDEF; font: inherit; font-size: 14px;"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A1A1AA;">
<span style="width: 16px; height: 16px; border-radius: 4px; background: #4F46E5; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span>30 天内保持登录</label>
<button style="height: 42px; border: 0; border-radius: 9px; background: #4F46E5; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500;">登录</button>
<a href="Main.dc.html" style="align-self: center; font-size: 13px;">以访客身份浏览面板</a>
</form>
</div>
</x-dc>
