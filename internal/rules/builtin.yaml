# LanPanel 内置端口与指纹规则
#
# 字段说明：
#   id        唯一标识
#   name      服务名称（显示用）
#   category  分类：nas / virt / router / media / download / ops / smarthome / printcam / base
#   ports     端口列表；带匹配条件的 Web 规则在其他端口上也会参与识别（应用被映射到非标准端口时依然能认出）
#   proto     web（自动判断 http/https）| http | https | tcp
#   match     匹配条件，任一满足即命中（all: true 时需全部满足）
#             field: title | body | server | header.<名称> | banner | favicon | status
#             op:    contains（默认，忽略大小写）| equals | prefix | regex | exists
#   probe     tcp 规则连接后先发送的内容（支持 \r\n 转义），用于触发欢迎信息
#   device    命中后推断的设备类型：router / switch / ap / nas / server / pc / phone / tv / printer / camera / iot
#   system    true 表示该服务代表设备的操作系统（如飞牛 fnOS），会显示在设备名下方
#   icon      面板图标（lucide 名称）；color 图标色调
#   url       面板地址模板，默认 {scheme}://{ip}:{port}

