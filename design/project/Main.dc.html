<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LanPanel 面板首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif;background:#0A0B0E;color:#EDEDEF}
a{color:#EDEDEF;text-decoration:none}a:hover{color:#FFFFFF}
.lp-dots{background-color:#0A0B0E;background-image:radial-gradient(rgba(255,255,255,0.07) 1px,transparent 1px);background-size:24px 24px}
</style>
</helmet>
<div class="lp-dots" style="width: 1440px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; color: #EDEDEF;">

<header style="height: 64px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(10,11,14,0.72);">
<div style="display: flex; align-items: center; gap: 10px;">
<div style="width: 28px; height: 28px; border-radius: 8px; background: #4F46E5; display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12l6-6M19 12a7 7 0 1 1-7-7M15 12a3 3 0 1 1-3-3"></path></svg>
</div>
<span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">LanPanel</span>
</div>
<div style="flex-grow: 1;"></div>
<a href="Discovery.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: rgba(79,70,229,0.16); border: 1px solid rgba(129,120,255,0.35); font-size: 13px; color: #C7C4FF;">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #8B84FF;"></span>发现 3 台新设备
</a>
<div role="group" aria-label="地址模式" style="display: flex; padding: 3px; border-radius: 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);">
<button style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.14); color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 500;">内网</button>
<button style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #A1A1AA; font: inherit; font-size: 12px;">外网</button>
</div>
<button aria-label="切换主题" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: transparent; display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
</button>
<a href="Discovery.dc.html" aria-label="管理后台" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"></path></svg>
</a>
</header>

<main style="width: 1200px; margin: 0 auto; padding: 56px 0 48px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="font-size: 88px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums;">14:32</div>
<div style="font-size: 14px; color: #A1A1AA;">9月22日 星期二 · <span style="font-family: 'Geist Mono', ui-monospace, monospace;">192.168.1.0/24</span> · 23 台设备在线</div>
</div>

<label style="align-self: center; width: 640px; height: 52px; box-sizing: border-box; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 12px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B8D98" stroke-width="1.8" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"></path></svg>
<input placeholder="搜索应用、设备、IP 或 MAC" style="flex-grow: 1; height: 100%; border: 0; outline: none; background: transparent; color: #EDEDEF; font: inherit; font-size: 15px;">
<span style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #8B8D98; display: flex; align-items: center;">/</span>
<span style="height: 36px; padding: 0 12px; border-radius: 9px; background: rgba(255,255,255,0.06); font-size: 13px; color: #A1A1AA; display: flex; align-items: center; gap: 6px;">Bing
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8B8D98" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></span>
</label>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{widgets}}" as="w" hint-placeholder-count="4">
<div style="padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 14px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; color: #8B8D98;">{{w.label}}</span>
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;">{{w.value}}</span>
<span style="font-size: 12px; color: #A1A1AA;">{{w.sub}}</span>
</div>
<svg width="84" height="32" viewBox="0 0 84 32" fill="none" stroke="{{w.color}}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><polyline points="{{w.spark}}"></polyline></svg>
</div>
</sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #D4D4D8;">{{g.name}}</h2>
<span style="font-size: 12px; color: #71717A; font-variant-numeric: tabular-nums;">{{g.count}}</span>
<div style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.06);"></div>
<button aria-label="添加应用" style="width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8D98" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{g.apps}}" as="app" hint-placeholder-count="4">
<a href="#" style="height: 68px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; opacity: {{app.opacity}};">
<div style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: {{app.bg}}; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{app.tint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{app.icon}}"></path></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 14px; font-weight: 500; color: #EDEDEF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{app.name}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #8B8D98; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{app.addr}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
<span title="{{app.statusText}}" style="width: 7px; height: 7px; border-radius: 4px; background: {{app.dot}};"></span>
<sc-if value="{{app.bound}}" hint-placeholder-val="{{true}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8178FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>已绑定设备，IP 变化时自动更新</title><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
</sc-if>
</div>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const I = {
nas: 'M3 12h18M5 5h14l2 7v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6zM7 16h.01M11 16h.01',
layers: 'M12 2l9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5',
server: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
film: 'M3 3h18v18H3zM7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18',
image: 'M3 3h18v18H3zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21',
music: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
folder: 'M3 6h6l2 2h10v11H3z',
router: 'M3 14h18v6H3zM7 17h.01M11 17h.01M12 14V9M8.5 7a5 5 0 0 1 7 0M6 4.5a8.5 8.5 0 0 1 12 0',
shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
box: 'M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8',
chart: 'M3 3v18h18M7 15l4-4 3 3 5-6',
home: 'M3 11l9-8 9 8M5 9.5V21h14V9.5',
download: 'M12 3v12M7 10l5 5 5-5M4 21h16',
printer: 'M6 9V2h12v7M6 18H4v-7h16v7h-2M6 14h12v8H6z',
bolt: 'M13 2L4 14h7l-1 8 9-12h-7z'
};
const T = { blue: '#8FA8FF', teal: '#5ED3BA', amber: '#F2BD62', violet: '#B4A1FF', rose: '#F79AAB', green: '#7BD88F', slate: '#A8B0BD' };
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
const app = (name, addr, icon, tint, bound, off) => ({
name, addr, icon: I[icon], tint: T[tint], bg: hexA(T[tint], 0.14), bound: !!bound,
dot: off ? '#52525B' : '#3DD68C', opacity: off ? 0.55 : 1, statusText: off ? '离线' : '在线'
});
const groups = [
{ name: '存储与虚拟化', apps: [
app('飞牛 fnOS', '192.168.1.23:5666', 'nas', 'blue', true),
app('群晖 DSM', '192.168.1.20:5000', 'nas', 'teal', true),
app('Proxmox VE', '192.168.1.10:8006', 'layers', 'amber', true),
app('VMware ESXi', '192.168.1.12', 'server', 'slate', true, true)
]},
{ name: '影音娱乐', apps: [
app('Jellyfin', '192.168.1.23:8096', 'film', 'violet', true),
app('Immich 相册', '192.168.1.23:2283', 'image', 'rose'),
app('Navidrome', '192.168.1.23:4533', 'music', 'green'),
app('Alist', '192.168.1.23:5244', 'folder', 'blue')
]},
{ name: '网络与运维', apps: [
app('OpenWrt', '192.168.1.1', 'router', 'teal'),
app('AdGuard Home', '192.168.1.1:3000', 'shield', 'green'),
app('Portainer', '192.168.1.10:9443', 'box', 'blue', true),
app('Grafana', '192.168.1.10:3000', 'chart', 'amber', true),
app('Home Assistant', '192.168.1.30:8123', 'home', 'teal'),
app('Node-RED', '192.168.1.30:1880', 'bolt', 'rose'),
app('qBittorrent', '192.168.1.23:8085', 'download', 'violet', true),
app('HP LaserJet', '192.168.1.60:631', 'printer', 'slate')
]}
].map(g => ({ ...g, count: g.apps.length }));
const widgets = [
{ label: '本机 · OpenWrt', value: 'CPU 12%', sub: '内存 312 / 1024 MB', color: '#8FA8FF', spark: '0,22 10,20 20,24 30,14 40,18 50,12 60,16 70,10 84,13' },
{ label: '网络吞吐', value: '↓ 2.4 MB/s', sub: '↑ 320 KB/s', color: '#5ED3BA', spark: '0,26 10,24 20,18 30,20 40,8 50,12 60,6 70,14 84,10' },
{ label: '局域网设备', value: '23 在线', sub: '共 31 台 · 3 台新发现', color: '#B4A1FF', spark: '0,20 12,20 24,18 36,18 48,14 60,14 72,12 84,10' },
{ label: '上次扫描', value: '12 分钟前', sub: '耗时 38 秒 · 每 30 分钟', color: '#F2BD62', spark: '0,16 12,16 24,16 36,16 48,16 60,16 72,16 84,16' }
];
return { groups, widgets };
}
}
</script>
</body>
</html>
