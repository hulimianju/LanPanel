<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6159F2"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 底板：圆角矩形，四周留白，符合飞牛与移动端图标规范 -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- 面板：三块应用卡片 -->
  <rect x="232" y="232" width="240" height="240" rx="64" fill="#FFFFFF"/>
  <rect x="232" y="552" width="240" height="240" rx="64" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="552" y="552" width="240" height="240" rx="64" fill="#FFFFFF" fill-opacity="0.72"/>
  <!-- 发现：雷达波纹 -->
  <circle cx="598" cy="426" r="40" fill="#FFFFFF"/>
  <path d="M598 306 A120 120 0 0 1 718 426" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <path d="M598 222 A204 204 0 0 1 802 426" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="44" stroke-linecap="round"/>
</svg>
